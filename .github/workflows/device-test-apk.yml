name: Device Test APK

on:
  push:
    branches:
      - test/device-apk
    paths:
      - '.github/workflows/device-test-apk.yml'
      - '.github/test-signing/**'
      - 'apps/mobile/**'
      - 'packages/follow_core/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEVICE_TEST_KEYSTORE_PATH: ${{ github.workspace }}/.github/test-signing/takip-analizi-test.keystore
      DEVICE_TEST_STORE_PASSWORD: device-test-only
      DEVICE_TEST_KEY_ALIAS: takiptest
      DEVICE_TEST_KEY_PASSWORD: device-test-only
      EXPECTED_PACKAGE_ID: com.zmilastudio.takipanalizi.dev
      EXPECTED_CERT_SHA256: 4735f6e6c0603ded3bfd6c236b625c08e116a8a38216088271997acdccc6d799
      EXPECTED_USER_ICON_SHA256: 7543b6233c3d23a139b94ecad6058ddd5ff861773339055268ccc85873923de0
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Verify physical-device compatibility wiring
        run: |
          grep -F 'android:icon="@drawable/takip_launcher_user"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:roundIcon="@drawable/takip_launcher_user"' android/app/src/main/AndroidManifest.xml
          grep -F 'io.flutter.embedding.android.EnableImpeller' android/app/src/main/AndroidManifest.xml
          grep -F 'android:value="false"' android/app/src/main/AndroidManifest.xml

          USER_ICON="android/app/src/main/res/drawable-nodpi/takip_launcher_user.webp"
          test -f "$USER_ICON"
          ICON_SHA256="$(sha256sum "$USER_ICON" | awk '{print $1}')"
          echo "User launcher SHA-256: $ICON_SHA256"
          test "$ICON_SHA256" = "$EXPECTED_USER_ICON_SHA256"

          test ! -f lib/features/analysis/presentation/analysis_screen.dart.tmp

      - name: Install deterministic device-test signing key
        run: |
          base64 --decode ../../.github/test-signing/takip-analizi-test.keystore.b64 > "$DEVICE_TEST_KEYSTORE_PATH"
          chmod 600 "$DEVICE_TEST_KEYSTORE_PATH"
          keytool -list -keystore "$DEVICE_TEST_KEYSTORE_PATH" \
            -storepass "$DEVICE_TEST_STORE_PASSWORD" \
            -alias "$DEVICE_TEST_KEY_ALIAS" >/dev/null

      - name: Build signed debug APK
        run: |
          VERSION_CODE=$((300000 + GITHUB_RUN_NUMBER))
          echo "DEVICE_TEST_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          flutter build apk --debug --build-number="$VERSION_CODE"

      - name: Verify package, version, exact launcher asset and signing certificate
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"

          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -F "name='$EXPECTED_PACKAGE_ID'"
          echo "$BADGING" | grep -F "versionCode='$DEVICE_TEST_VERSION_CODE'"
          echo "$BADGING" | grep -F 'application-icon-' | grep -F 'takip_launcher_user'
          unzip -l "$APK" | grep -F 'takip_launcher_user.webp'

          CERT_OUTPUT="$($APKSIGNER verify --print-certs "$APK" 2>&1)"
          echo "$CERT_OUTPUT"
          CERT_SHA256="$(printf '%s\n' "$CERT_OUTPUT" \
            | grep -i 'certificate SHA-256 digest' \
            | head -1 \
            | awk '{print $NF}' \
            | tr -d '\r' \
            | tr '[:upper:]' '[:lower:]')"
          echo "APK certificate SHA-256: $CERT_SHA256"
          test -n "$CERT_SHA256"
          test "$CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Prepare test package
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk ../../takip-analizi-device-test.apk
          cd ../..
          sha256sum takip-analizi-device-test.apk > takip-analizi-device-test.sha256

      - name: Publish prerelease
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="device-test-v2-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            takip-analizi-device-test.apk \
            takip-analizi-device-test.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Takip Analizi - Physical Device Test" \
            --notes "Device-test APK. Paket: $EXPECTED_PACKAGE_ID. VersionCode: $DEVICE_TEST_VERSION_CODE. v2-23 fiziksel PASS analiz özellikleri korunur. Launcher simgesi kullanıcının gönderdiği raster görselden doğrudan kullanılır; yeniden çizim veya vektör simge yoktur. Kaynak icon SHA-256: $EXPECTED_USER_ICON_SHA256. Mevcut v2 uygulamanın üzerine kaldırmadan güncellenmelidir. Production sürümü değildir." \
            --prerelease
