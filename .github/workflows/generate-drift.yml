name: Generate Drift

on:
  push:
    branches:
      - feat/local-snapshot-history
    paths:
      - apps/mobile/pubspec.yaml
      - apps/mobile/lib/data/local/follow_history_database.dart
      - .github/workflows/generate-drift.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate Drift database code
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Commit generated database code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/data/local/follow_history_database.g.dart
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: generate Drift database code"
          git push
