name: Closed Test AAB

on:
  push:
    branches:
      - dev/ads-v1
    paths:
      - '.github/workflows/closed-test-aab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-closed-test-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_PRODUCTION_PACKAGE_ID: com.zmilastudio.takipanalizi
      EXPECTED_VERSION_NAME: '1.0.0'
      EXPECTED_VERSION_CODE: '4'
      EXPECTED_TARGET_SDK: '36'
      EXPECTED_USER_ICON_SHA256: 7543b6233c3d23a139b94ecad6058ddd5ff861773339055268ccc85873923de0
      EXPECTED_TEST_ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
      PLAY_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/.github/production-signing/upload-keystore.jks
      PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
      PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
      PLAY_UPLOAD_CERT_SHA256: ${{ secrets.PLAY_UPLOAD_CERT_SHA256 }}
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install and verify private Play upload key
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_B64"
          test -n "$PLAY_UPLOAD_STORE_PASSWORD"
          test -n "$PLAY_UPLOAD_KEY_ALIAS"
          test -n "$PLAY_UPLOAD_KEY_PASSWORD"
          test -n "$PLAY_UPLOAD_CERT_SHA256"

          mkdir -p "$(dirname "$PLAY_UPLOAD_KEYSTORE_PATH")"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$PLAY_UPLOAD_KEYSTORE_PATH"
          chmod 600 "$PLAY_UPLOAD_KEYSTORE_PATH"

          KEY_OUTPUT="$(keytool -list -v \
            -keystore "$PLAY_UPLOAD_KEYSTORE_PATH" \
            -storepass "$PLAY_UPLOAD_STORE_PASSWORD" \
            -alias "$PLAY_UPLOAD_KEY_ALIAS")"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$KEY_OUTPUT" \
            | grep -i 'SHA256:' \
            | head -1 \
            | sed 's/.*SHA256:[[:space:]]*//' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256="$(printf '%s' "$PLAY_UPLOAD_CERT_SHA256" \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Verify RC4 closed-test source guards
        run: |
          grep -F 'applicationId = "com.zmilastudio.takipanalizi"' android/app/build.gradle.kts
          grep -F 'signingConfigs.getByName("playUpload")' android/app/build.gradle.kts
          grep -F 'version: 1.0.0+4' pubspec.yaml
          grep -F 'google_mobile_ads: ^9.1.0' pubspec.yaml
          grep -F 'implementation("androidx.work:work-runtime:2.11.2")' android/app/build.gradle.kts
          grep -F 'com.google.android.gms.ads.APPLICATION_ID' android/app/src/main/AndroidManifest.xml
          grep -F 'manifestPlaceholders["admobAppId"] = admobAppId' android/app/build.gradle.kts
          grep -F "$EXPECTED_TEST_ADMOB_APP_ID" android/app/build.gradle.kts
          grep -F 'com.google.android.gms.ads.MobileAdsInitProvider' android/app/src/main/AndroidManifest.xml
          grep -F 'tools:node="remove"' android/app/src/main/AndroidManifest.xml
          ! grep -F '<uses-permission' android/app/src/main/AndroidManifest.xml
          grep -F 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml

          USER_ICON="android/app/src/main/res/drawable-nodpi/takip_launcher_user.webp"
          test "$(sha256sum "$USER_ICON" | awk '{print $1}')" = "$EXPECTED_USER_ICON_SHA256"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Build signed closed-test AAB with Google test ads
        run: |
          flutter build appbundle \
            --release \
            --build-name="$EXPECTED_VERSION_NAME" \
            --build-number="$EXPECTED_VERSION_CODE" \
            --dart-define=ADMOB_USE_TEST_IDS=true

      - name: Verify Android 16 WorkManager runtime
        run: |
          WORK_RUNTIME_DIR="$HOME/.gradle/caches/modules-2/files-2.1/androidx.work/work-runtime/2.11.2"
          test -d "$WORK_RUNTIME_DIR"
          WORK_RUNTIME_AAR="$(find "$WORK_RUNTIME_DIR" -type f -name '*.aar' -print -quit)"
          test -n "$WORK_RUNTIME_AAR"
          printf 'Resolved WorkManager runtime: %s\n' "$WORK_RUNTIME_AAR"

      - name: Verify merged release manifest
        run: |
          RELEASE_MANIFEST="$(find build/app/intermediates \
            -type f \
            -name AndroidManifest.xml \
            -path '*release*' \
            | grep -E '/merged_manifest(s)?/' \
            | head -1)"
          test -n "$RELEASE_MANIFEST"

          grep -F "package=\"$EXPECTED_PRODUCTION_PACKAGE_ID\"" "$RELEASE_MANIFEST" || true
          grep -F 'android:allowBackup="false"' "$RELEASE_MANIFEST"
          grep -F 'android:usesCleartextTraffic="false"' "$RELEASE_MANIFEST"
          grep -F "$EXPECTED_TEST_ADMOB_APP_ID" "$RELEASE_MANIFEST"
          ! grep -F 'android:debuggable="true"' "$RELEASE_MANIFEST"
          ! grep -F 'android:testOnly="true"' "$RELEASE_MANIFEST"
          ! grep -F 'com.google.android.gms.ads.MobileAdsInitProvider' "$RELEASE_MANIFEST"

          MERGED_PERMISSIONS="$(grep -oE '<uses-permission[^>]+android:name="[^"]+"' "$RELEASE_MANIFEST" \
            | sed -E 's/.*android:name="([^"]+)".*/\1/' \
            | sort -u || true)"
          EXPECTED_PERMISSIONS="$(printf '%s\n' \
            android.permission.ACCESS_ADSERVICES_AD_ID \
            android.permission.ACCESS_ADSERVICES_ATTRIBUTION \
            android.permission.ACCESS_ADSERVICES_TOPICS \
            android.permission.ACCESS_NETWORK_STATE \
            android.permission.FOREGROUND_SERVICE \
            android.permission.INTERNET \
            android.permission.WAKE_LOCK \
            com.google.android.gms.permission.AD_ID \
            "$EXPECTED_PRODUCTION_PACKAGE_ID.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" \
            | sort -u)"

          printf 'CLOSED_TEST_MERGED_PERMISSIONS_BEGIN\n%s\nCLOSED_TEST_MERGED_PERMISSIONS_END\n' "$MERGED_PERMISSIONS"
          test "$MERGED_PERMISSIONS" = "$EXPECTED_PERMISSIONS"

      - name: Verify signed AAB
        run: |
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          test -s "$AAB"

          jarsigner -verify "$AAB"

          AAB_CERT_OUTPUT="$(keytool -printcert -jarfile "$AAB")"
          AAB_CERT_SHA256="$(printf '%s\n' "$AAB_CERT_OUTPUT" \
            | grep -i 'SHA256:' \
            | head -1 \
            | sed 's/.*SHA256:[[:space:]]*//' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256="$(printf '%s' "$PLAY_UPLOAD_CERT_SHA256" \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"
          test "$AAB_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          unzip -l "$AAB" | grep -F 'takip_launcher_user.webp'
          sha256sum "$AAB" > build/app/outputs/bundle/release/app-release.aab.sha256

      - name: Upload closed-test AAB
        uses: actions/upload-artifact@v4
        with:
          name: takip-analizi-closed-test-1.0.0-4
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/bundle/release/app-release.aab.sha256
          retention-days: 1
          if-no-files-found: error
