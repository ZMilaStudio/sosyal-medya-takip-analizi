name: Bootstrap Android

on:
  push:
    branches:
      - feat/android-platform-wrapper
    paths:
      - .github/workflows/bootstrap-android.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Generate official Android wrapper
        working-directory: apps/mobile
        run: flutter create --platforms=android --android-language=kotlin --org=com.zmilastudio --project-name=takipanalizi --no-pub .
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Validate Android debug build
        working-directory: apps/mobile
        run: flutter build apk --debug
      - name: Commit generated platform files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/android apps/mobile/.metadata
          if git diff --cached --quiet; then
            echo "No generated platform changes."
            exit 0
          fi
          git commit -m "chore: generate Android wrapper with Flutter 3.47.2"
          git push
