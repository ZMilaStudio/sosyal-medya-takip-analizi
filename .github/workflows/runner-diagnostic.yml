name: Runner Diagnostic

on:
  push:
    branches:
      - test/device-apk
    paths:
      - '.github/workflows/runner-diagnostic.yml'

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Confirm runner allocation
        run: |
          echo "runner allocated"
          uname -a
